name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchdeck
          POSTGRES_PASSWORD: pitchdeck_dev
          POSTGRES_DB: pitchdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchdeck -d pitchdeck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pitchdeck:pitchdeck_dev@localhost:5432/pitchdeck?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      LOG_LEVEL: silent
      WEB_BASE_URL: http://localhost:3000
      ADMIN_WEB_BASE_URL: http://localhost:3001
      AUTH_JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      AUTH_JWT_ACCESS_EXPIRES: 15m
      AUTH_REFRESH_EXPIRES: 7d
      AUTH_COOKIE_SECURE: "false"
      AUTH_CSRF_SECRET: ci-csrf-secret-minimum-32-characters
      EMAIL_PROVIDER: log
      EMAIL_FROM: noreply@pitchdeck.test
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: pitchdeck_minio
      OBJECT_STORAGE_SECRET_KEY: pitchdeck_minio_dev
      OBJECT_STORAGE_BUCKET: pitchdeck-uploads
      FILE_SCAN_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run -d --name pitchdeck-minio-ci \
            --network host \
            -e MINIO_ROOT_USER=pitchdeck_minio \
            -e MINIO_ROOT_PASSWORD=pitchdeck_minio_dev \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become healthy"
          docker logs pitchdeck-minio-ci
          exit 1

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed reference data
        run: pnpm db:seed

      - name: Initialise object storage bucket
        run: |
          docker run --rm --network host minio/mc:latest sh -c \
            "mc alias set local http://127.0.0.1:9000 pitchdeck_minio pitchdeck_minio_dev && mc mb local/pitchdeck-uploads --ignore-existing"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: API integration tests
        run: pnpm --filter @pitchdeck/api test:integration

      - name: Production builds
        run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pitchdeck
          POSTGRES_PASSWORD: pitchdeck_dev
          POSTGRES_DB: pitchdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitchdeck -d pitchdeck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pitchdeck:pitchdeck_dev@localhost:5432/pitchdeck?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      LOG_LEVEL: silent
      WEB_BASE_URL: http://localhost:3000
      ADMIN_WEB_BASE_URL: http://localhost:3001
      AUTH_JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      AUTH_JWT_ACCESS_EXPIRES: 15m
      AUTH_REFRESH_EXPIRES: 7d
      AUTH_COOKIE_SECURE: "false"
      AUTH_CSRF_SECRET: ci-csrf-secret-minimum-32-characters
      EMAIL_PROVIDER: capture
      EMAIL_FROM: noreply@pitchdeck.test
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_ACCESS_KEY: pitchdeck_minio
      OBJECT_STORAGE_SECRET_KEY: pitchdeck_minio_dev
      OBJECT_STORAGE_BUCKET: pitchdeck-uploads
      FILE_SCAN_MODE: mock
      ENABLE_TEST_ENDPOINTS: "true"
      BOOTSTRAP_SUPER_ADMIN_EMAIL: superadmin@e2e.pitchdeck.test
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: SuperAdminPass123!
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pitchdeck/web exec playwright install --with-deps chromium

      - name: Start MinIO
        run: |
          docker run -d --name pitchdeck-minio-ci \
            --network host \
            -e MINIO_ROOT_USER=pitchdeck_minio \
            -e MINIO_ROOT_PASSWORD=pitchdeck_minio_dev \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become healthy"
          docker logs pitchdeck-minio-ci
          exit 1

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed reference data
        run: pnpm db:seed

      - name: Initialise object storage bucket
        run: |
          docker run --rm --network host minio/mc:latest sh -c \
            "mc alias set local http://127.0.0.1:9000 pitchdeck_minio pitchdeck_minio_dev && mc mb local/pitchdeck-uploads --ignore-existing"

      - name: Build applications
        run: pnpm build

      - name: Public web E2E
        run: pnpm --filter @pitchdeck/web test:e2e

      - name: Admin web E2E
        run: pnpm --filter @pitchdeck/admin-web test:e2e
