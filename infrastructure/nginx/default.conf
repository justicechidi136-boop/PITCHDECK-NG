# Nginx reverse proxy configuration placeholder for production deployment.
# This file will be expanded when deployment topology is finalised.

upstream pitchdeck_web {
    server host.docker.internal:3000;
}

upstream pitchdeck_admin {
    server host.docker.internal:3001;
}

upstream pitchdeck_api {
    server host.docker.internal:4000;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://pitchdeck_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://pitchdeck_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ {
        proxy_pass http://pitchdeck_api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
